<ng-container *transloco="let t; prefix: 'header'">
  <nav class="side-nav navbar-expand-lg w-100">
    <div class="nav flex-column">
      <div class="nav-item">
        <div class="logo-wrapper px-3 py-2" >
          <button
            type="button"
            class="logo-wrapper px-3 py-2 border-0 bg-transparent"
            (click)="navigateToDashboard()"
          >
            <img
              src="https://placehold.co/300x180"
              alt="logo"
              class="logo-img"
            />
          </button>
        </div>

        <ul class="nav flex-column">
          @for (item of navItems(); track $index) {
            @let is_selected_menu = openMenuId() === item.id;
            <li class="nav-item"
              routerLinkActive="active"
              #menuRla="routerLinkActive"
              [routerLinkActiveOptions]="{ exact: false }"
              >
              <button
                class="nav-link d-flex align-items-center justify-content-between"
                type="button"
                (click)="item.children.length ? toggleMenu(item.id) : null"
                [routerLink]="item.children.length ? null : item.route"
                [class.active]="menuRla.isActive"
              >
                <div class="d-flex align-items-center gap-3">
                  <shared-load-sidemenu-icons [iconName]="item.iconName" [isActiveMenu]="menuRla.isActive" />
                  <span class="nav-text">{{ t(item.mainMenuLabelName) }}</span>
                </div>
                <img
                  src="assets/images/side-nav-chevron.svg"
                  alt="chevron"
                  [class.chevron]="item.children.length"
                  [class.rotate]="is_selected_menu"
                  class="chevron-arrow"
                />
              </button>
              @if (item.children.length && is_selected_menu) {
                <ul class="sub-menu">
                  <span class="submenu-trail"></span>
                  @for (child of item.children; track $index) {
                    <li
                      class="sub-menu-item"
                      routerLinkActive="active-submenu"
                      [routerLinkActiveOptions]="{ exact: false }"
                    >
                      <a class="sub-menu-link" [routerLink]="child.route">
                        {{ t('subMenus.' + child.subMenulabelName) }}
                      </a>
                    </li>
                  }
                </ul>
              }
            </li>
          }
        </ul>
      </div>
    </div>
  </nav>
</ng-container>
