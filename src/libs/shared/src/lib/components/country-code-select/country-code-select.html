<ng-container *transloco="let t; prefix: 'countryCodeInput'">
  <ng-select
    [virtualScroll]="true"
    [clearable]="false"
    [items]="countryCodes()"
    [bindValue]="'dialingCode'"
    [bindLabel]="bindLabel()"
    [searchFn]="searchFn()"
    [searchable]="true"
    [placeholder]="t(placeholder())"
    [ngModel]="value"
    (ngModelChange)="onValueChange($event)"
    [disabled]="disabled || readonly()"
  >
    <!-- [(ngModel)]="value" -->
    <ng-template ng-option-tmp let-item="item">
      <span dir="ltr">
        @if (showFlag()) {
          <span class="fi fi-{{ item.code?.toLowerCase() }} l-me-1"></span>
        }
        {{ item[bindLabel()] }}
      </span>
    </ng-template>

    <ng-template ng-label-tmp let-item="item">
      <span dir="ltr">
        @if (showFlag()) {
          <span class="fi fi-{{ item.code?.toLowerCase() }} l-me-1"></span>
        }
        <span class="l-me-1">
          {{ item[bindLabel()] }}
        </span>
      </span>
    </ng-template>
  </ng-select>
</ng-container>
