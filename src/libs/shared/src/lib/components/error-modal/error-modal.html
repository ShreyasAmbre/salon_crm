<ng-container *transloco="let t; prefix: 'modal'">
  <div class="card p-4">
    <div class="card-body error-wrapper d-flex flex-column align-items-center justify-content-center gap-3">
      <img src="/assets/images/error-icon.svg" alt="error icon" />
      <p class="m-0 text-center error-title">{{ t(errorTitle()) }}</p>
      <p class="m-0 text-center error-msg">
        {{ isMessageTranslateKey() ? t(errorMessage()) : errorMessage() }}
      </p>
      <div class="d-flex mt-3 w-100">
        <button class="btn btn-outline-accent-red btn-h-48 w-100" (click)="close()">
          {{ t(errorButtonText()) }}
        </button>
      </div>
    </div>
  </div>
</ng-container>
